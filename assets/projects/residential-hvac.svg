    <text x="500" y="277">300×200</text>
    <text x="191" y="206" transform="rotate(-90 191 206)">Ø150</text>
    <text x="416" y="206" transform="rotate(-90 416 206)">Ø150</text>
    <text x="621" y="206" transform="rotate(-90 621 206)">Ø150</text>
  </g>
  <g fill="#6f8499" font-size="7" text-anchor="middle">

  </g>
  <text x="120" y="484" fill="#6f8499" font-size="8">N</text>

  <!-- title block -->
  <rect x="552" y="482" width="220" height="50" fill="#0e1319" stroke="#3a4a5c"/>
  <path d="M690 482V532M552 507H690" stroke="#3a4a5c"/>
  <text x="559" y="498" font-size="8" fill="#c9d3de" letter-spacing=".5">RESIDENTIAL HVAC LAYOUT</text>
  <text x="559" y="523" font-size="7" fill="#6f8499" letter-spacing=".5">SCALE 1:100 · J.A.B.</text>
  <text x="731" y="512" font-size="14" fill="#d4a85c" text-anchor="middle">M-101</text>

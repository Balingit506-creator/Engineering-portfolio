    <path d="M340 250V210A40 40 0 0 1 380 250"/>
    <path d="M560 250V210A40 40 0 0 1 600 250"/>
    <path d="M430 440V400A40 40 0 0 1 470 440"/>
  </g>
  <path d="M430 440H470" stroke="#0e1319" stroke-width="6"/>


    <rect x="652" y="298" width="16" height="66" fill="rgba(212,168,92,.12)"/>
    <path d="M185 282V166M410 282V166M615 282V166M185 298V349M420 298V349M560 298V349" fill="none"/>
  </g>
  <use href="#d" x="185" y="155"/><use href="#d" x="410" y="155"/><use href="#d" x="615" y="155"/>
  <use href="#d" x="185" y="360"/><use href="#d" x="420" y="360"/><use href="#d" x="560" y="360"/>

  <!-- AHU -->
  <rect x="632" y="364" width="56" height="40" fill="#141a21" stroke="#c9d3de" stroke-width="1.2"/>
  <path d="M632 364L688 404M688 364L632 404" stroke="#3a4a5c"/>
  <text x="660" y="420" fill="#c9d3de" font-size="8" text-anchor="middle">AHU-1</text>


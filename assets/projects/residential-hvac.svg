  <rect x="468" y="310" width="36" height="14" fill="none" stroke="#7fa7c9"/>
  <path d="M474 310V324M480 310V324M486 310V324M492 310V324M498 310V324" stroke="#7fa7c9" stroke-width=".7"/>
  <path d="M504 317H632" stroke="#7fa7c9" stroke-dasharray="6 4" fill="none"/>
  <text x="486" y="338" fill="#7fa7c9" font-size="7" text-anchor="middle">RA 600×300</text>


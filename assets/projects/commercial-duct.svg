    <rect x="104" y="264" width="12" height="12"/><rect x="284" y="264" width="12" height="12"/><rect x="464" y="264" width="12" height="12"/><rect x="644" y="264" width="12" height="12"/>
    <rect x="104" y="434" width="12" height="12"/><rect x="284" y="434" width="12" height="12"/><rect x="464" y="434" width="12" height="12"/><rect x="644" y="434" width="12" height="12"/>
  </g>


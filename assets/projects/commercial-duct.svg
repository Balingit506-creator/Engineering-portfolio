    <g id="d"><rect x="-9" y="-9" width="18" height="18" fill="#0e1319" stroke="#d4a85c"/><path d="M-9-9L9 9M9-9L-9 9" stroke="#d4a85c" stroke-width=".7"/></g>
    <g id="v"><rect x="-20" y="-11" width="40" height="22" fill="#141a21" stroke="#c9d3de" stroke-width="1.1"/><path d="M-20 11L20-11" stroke="#3a4a5c"/></g>
  </defs>

    <rect width="220" height="84" fill="#0e1319" stroke="#3a4a5c"/>
    <path d="M0 12H220M0 24H220M0 36H220M0 48H220M0 60H220M0 72H220M24 0V84M180 0V84" stroke="#26323f"/>
